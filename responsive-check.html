<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>护理工作台 · 画面检查</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#e7e9e1;color:#3c4c3d;font:12px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}label{display:flex;align-items:center;gap:4px}input{width:65px;padding:7px;border:1px solid #c1ccba;border-radius:4px}#version{width:110px}button{padding:8px 10px;background:#fafbf6;border:1px solid #b8c4b0;border-radius:4px;color:inherit;cursor:pointer}main{display:flex;justify-content:center}iframe{display:block;border:0;background:#faf9f5;box-shadow:0 6px 24px #0001}output{font-variant-numeric:tabular-nums}</style></head><body><header><strong>画面检查</strong><label>版本<input id="version" aria-label="预览提交版本" value="cb756cb7c8c8215af9d1bf6121aead48476b439a"></label><button id="load">载入版本</button><label>宽<input id="w" aria-label="预览宽度" type="number" value="390"></label><label>高<input id="h" aria-label="预览高度" type="number" value="844"></label><button id="apply">应用尺寸</button><button data-size="390,844">390 × 844</button><button data-size="360,640">360 × 640</button><button data-size="320,568">320 × 568</button><button data-size="844,390">横屏 844 × 390</button><output id="size">390 × 844</output></header><main><iframe id="phone" title="响应式游戏预览" width="390" height="844" src="https://htmlpreview.github.io/?https://github.com/chenziyang110/pore-master-clinic/blob/cb756cb7c8c8215af9d1bf6121aead48476b439a/index.html"></iframe></main><script>const w=document.getElementById('w'),h=document.getElementById('h'),f=document.getElementById('phone');function resize(){f.width=Math.max(280,Number(w.value)||390);f.height=Math.max(300,Number(h.value)||844);document.getElementById('size').textContent=f.width+' × '+f.height}document.getElementById('apply').onclick=resize;document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{[w.value,h.value]=b.dataset.size.split(',');resize()});document.getElementById('load').onclick=()=>{const v=document.getElementById('version').value.trim();if(/^[a-f0-9]{40}$/.test(v))f.src='https://htmlpreview.github.io/?https://github.com/chenziyang110/pore-master-clinic/blob/'+v+'/index.html'};</script></body></html>
