<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>妙手净肤馆 · 视口检查</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, 'PingFang SC', sans-serif; color: #253b30; background: #eef1ec; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .controls { padding: 18px 24px; background: #fafbf8; border-bottom: 1px solid #cdd7ca; }
    h1 { margin: 0 0 7px; font-size: 20px; font-weight: 600; }
    p { margin: 0 0 14px; color: #536353; font-size: 13px; line-height: 1.6; }
    form { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; }
    label { display: grid; gap: 5px; color: #344c3c; font-size: 12px; }
    .url-field { flex: 1 1 320px; }
    input { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid #aebdab; border-radius: 5px; background: white; color: #24382c; font: inherit; font-size: 14px; }
    input[type='number'] { width: 100px; }
    button, .open-target { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 12px; border: 1px solid #9cad98; border-radius: 5px; background: white; color: #294833; font: inherit; font-size: 13px; cursor: pointer; text-decoration: none; }
    #apply-viewport { border-color: #42644b; background: #42644b; color: white; }
    button:hover, .open-target:hover { filter: brightness(.96); }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid #749469; outline-offset: 3px; }
    .presets { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .presets button { min-height: 36px; padding: 6px 10px; font-size: 12px; }
    .presets button[aria-pressed='true'] { color: #233e2c; background: #e0e9dc; border-color: #698063; }
    #preview-status { display: block; margin-top: 11px; font-size: 12px; line-height: 1.5; color: #536353; overflow-wrap: anywhere; }
    .preview-stage { padding: 20px; overflow: auto; }
    .viewport-outline { width: max-content; margin: 0 auto; padding: 0; border: 1px solid #8d9b87; background: white; box-shadow: 0 8px 28px #2c422016; }
    #phone { display: block; border: 0; background: white; }
    .scope-note { padding: 0 24px 20px; font-size: 12px; }
    @media (max-width: 600px) { .controls { padding: 15px; } .preview-stage { padding: 12px; } .scope-note { padding-inline: 15px; } }
  </style>
</head>
<body>
  <header class="controls">
    <h1>游戏视口检查</h1>
    <p>填写公开网址，或用 ../index.html 检查本地游戏。尺寸按 CSS 像素设置；只改尺寸时保留当前游戏，不缩放内容。</p>
    <form id="viewport-form">
      <label class="url-field" for="target-url">目标网址<input id="target-url" name="target" type="text" inputmode="url" value="../index.html" spellcheck="false" autocomplete="off"></label>
      <label for="viewport-width">宽度<input id="viewport-width" name="width" type="number" value="390" min="240" max="2560" step="1" required></label>
      <label for="viewport-height">高度<input id="viewport-height" name="height" type="number" value="844" min="240" max="2560" step="1" required></label>
      <button id="apply-viewport" type="submit">应用网址与尺寸</button>
      <button id="rotate-viewport" type="button">交换宽高</button>
      <button id="reload-preview" type="button">重新加载游戏</button>
      <a id="open-target" class="open-target" href="../index.html" target="_blank" rel="noopener noreferrer">单独打开目标</a>
    </form>
    <nav class="presets" aria-label="常用视口预设">
      <button type="button" data-width="320" data-height="568" aria-pressed="false">小屏 320×568</button>
      <button type="button" data-width="360" data-height="640" aria-pressed="false">手机 360×640</button>
      <button type="button" data-width="375" data-height="667" aria-pressed="false">手机 375×667</button>
      <button type="button" data-width="390" data-height="844" aria-pressed="true">手机 390×844</button>
      <button type="button" data-width="430" data-height="932" aria-pressed="false">手机 430×932</button>
      <button type="button" data-width="568" data-height="320" aria-pressed="false">短横屏 568×320</button>
      <button type="button" data-width="844" data-height="390" aria-pressed="false">横屏 844×390</button>
      <button type="button" data-width="768" data-height="1024" aria-pressed="false">平板 768×1024</button>
      <button type="button" data-width="820" data-height="1180" aria-pressed="false">平板 820×1180</button>
      <button type="button" data-width="1024" data-height="768" aria-pressed="false">平板横屏 1024×768</button>
    </nav>
    <output id="preview-status" role="status" aria-live="polite"></output>
  </header>
  <main class="preview-stage" aria-label="实际游戏页面预览">
    <div class="viewport-outline"><iframe id="phone" name="phone" title="所选尺寸下的实际游戏" src="../index.html" width="390" height="844" allow="fullscreen"></iframe></div>
  </main>
  <p class="scope-note">预览框可横向滚动。这里检查 CSS 视口布局，不模拟设备像素比、系统安全区或真实触控；此检查页不进入发布产物。</p>
  <script>
    const form = document.getElementById('viewport-form');
    const targetInput = document.getElementById('target-url');
    const widthInput = document.getElementById('viewport-width');
    const heightInput = document.getElementById('viewport-height');
    const phone = document.getElementById('phone');
    const status = document.getElementById('preview-status');
    const presets = [...document.querySelectorAll('[data-width][data-height]')];

    function applyViewport() {
      targetInput.setCustomValidity('');
      let target;
      try {
        target = new URL(targetInput.value.trim() || '../index.html', document.baseURI);
        if (!['http:', 'https:', 'file:'].includes(target.protocol)) throw new Error('Unsupported URL');
      } catch (_) {
        targetInput.setCustomValidity('请输入 http/https 网址或本地相对路径。');
      }
      if (!form.reportValidity()) return false;
      const width = Number(widthInput.value), height = Number(heightInput.value);
      if (!Number.isInteger(width) || !Number.isInteger(height)) return false;
      phone.width = String(width);
      phone.height = String(height);
      // Setting the same src reloads the embedded page. Resizing deliberately
      // preserves it, including any real in-progress care and owner state.
      if (phone.src !== target.href) phone.src = target.href;
      document.getElementById('open-target').href = target.href;
      for (const preset of presets) {
        preset.setAttribute('aria-pressed', String(Number(preset.dataset.width) === width && Number(preset.dataset.height) === height));
      }
      status.textContent = `已应用 ${width} × ${height} CSS 像素 · ${target.href}`;
      return true;
    }

    form.addEventListener('submit', event => { event.preventDefault(); applyViewport(); });
    targetInput.addEventListener('input', () => targetInput.setCustomValidity(''));
    for (const preset of presets) preset.addEventListener('click', () => {
      widthInput.value = preset.dataset.width;
      heightInput.value = preset.dataset.height;
      applyViewport();
    });
    document.getElementById('rotate-viewport').addEventListener('click', () => {
      const oldWidth = widthInput.value;
      widthInput.value = heightInput.value;
      heightInput.value = oldWidth;
      applyViewport();
    });
    document.getElementById('reload-preview').addEventListener('click', () => {
      const previousSource = phone.src;
      if (applyViewport() && phone.src === previousSource) phone.src = phone.src;
    });
    applyViewport();
  </script>
</body>
</html>
